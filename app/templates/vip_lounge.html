{% extends "base.html" %}

{% block title %}Lounge Vip{% endblock %}

{% block content %}
<h4 class="mb-3">Lounge Vip 🛋️</h4>
<p class="text-muted">Responde rapidinho enquanto dá aquela descansada.</p>

<form method="post" action="/vip-lounge">
    <div class="mb-3">
        <label class="form-label">Seu código</label>
        <input type="text" class="form-control text-uppercase" name="id_public" required autofocus>
    </div>

    <div class="mb-3">
        <label class="form-label">Qual é o seu superpoder no Exagerado?</label>
        <select class="form-select" name="perfil_consumo" required>
            <option value="" disabled selected>Escolhe uma opção</option>
            <option value="cacador_pechincha">Caçador de Pechincha (foco em promoção)</option>
            <option value="equilibrado">Equilibrado (marca boa com preço justo)</option>
            <option value="sem_limite">Cartão Sem Limite (renovando o guarda-roupa)</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">O que você tá de olho hoje?</label>
        <select class="form-select" name="intencao_compra" required>
            <option value="" disabled selected>Escolhe uma opção</option>
            <option value="moda">Moda</option>
            <option value="pet">Pet</option>
            <option value="casa">Casa</option>
            <option value="eletro">Eletrodomésticos</option>
            <option value="beleza">Beleza</option>
            <option value="outros">Outros</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary w-100">Confirmar</button>
</form>
<p class="text-center text-muted small mt-3">
    Ainda não tem código? <a href="/form/entrada">Cadastre-se aqui</a>
</p>
{% endblock %}
