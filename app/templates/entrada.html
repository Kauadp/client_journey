{% extends "base.html" %}

{% block title %}Passaporte Exagerado{% endblock %}

{% block content %}
<h4 class="mb-3">Bem-vindo(a) ao Exagerado! 🎉</h4>
<p class="text-muted">Preenche rapidinho pra liberar seu Passaporte Exagerado.</p>

<form method="post" action="/entrada">
    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" class="form-control" name="nome" required>
    </div>

    <div class="mb-3">
        <label class="form-label">WhatsApp</label>
        <input type="tel" class="form-control" name="telefone" placeholder="(27) 99999-9999" required>
    </div>

    <div class="mb-3">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-control" name="email" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Quero meu Passaporte</button>
</form>
{% endblock %}
