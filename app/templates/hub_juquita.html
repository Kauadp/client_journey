{% extends "base.html" %}

{% block title %}Hub Juquita{% endblock %}

{% block content %}
<h4 class="mb-3">Hub Juquita 🎮</h4>
<p class="text-muted">Responde rapidinho e libera seu ecocopo ou aluguel de frota.</p>

<form method="post" action="/hub-juquita">
    <div class="mb-3">
        <label class="form-label">Seu código</label>
        <input type="text" class="form-control text-uppercase" name="id_public" required autofocus>
    </div>

    <div class="mb-3">
        <label class="form-label">Quem é a sua comitiva exagerada hoje?</label>
        <select class="form-select" name="composicao" required>
            <option value="" disabled selected>Escolhe uma opção</option>
            <option value="lobo_solitario">Lobo Solitário — vim focado pra garimpar</option>
            <option value="em_casal">Em Casal</option>
            <option value="bando_galera">Bando / Galera</option>
            <option value="familia_pet">Modo Família ON / Pet Lover</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Sua faixa de idade</label>
        <select class="form-select" name="faixa_etaria" required>
            <option value="" disabled selected>Escolhe uma opção</option>
            <option value="geracao_z">Geração Z (até 24) — "Se não tá no TikTok, nem fiquei sabendo"</option>
            <option value="millennial">Millennial (25-40) — "Já venho de dipirona na bolsa"</option>
            <option value="experiente_chique">Experiente & Chique (41-55) — "Só aceito o melhor"</option>
            <option value="exagerado_classico">Exagerado Clássico (56+) — "Aposentadoria é pra gastar com estilo"</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">De onde você veio pra passar esse 'perrengue chique' de fazer compras com a gente?"</label>
        <select class="form-select" name="local_origem" required>
            <option value="" disabled selected>Escolhe uma opção</option>
            <option value="zona_sul">Zona Sul (É no meu quintal, Ibirapuera raiz!)</option>
            <option value="zona_oeste">Zona Oeste (Cruzei a ponte/Pinheiros/Perdizes)</option>
            <option value="zona_leste">Zona Leste (Vim de longe, respeita meu corre!)</option>
            <option value="zona_norte">Zona Norte / Centro</option>
            <option value="outro">Grande SP / ABC / Litoral / Interior / Outro</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary w-100">Confirmar</button>
</form>
<p class="text-center text-muted small mt-3">
    Ainda não tem código? <a href="/form/entrada">Cadastre-se aqui</a>
</p>
{% endblock %}
