{% extends "base.html" %}

{% block title %}Hub Juquita{% endblock %}

{% block content %}
<h4 class="mb-3">Hub Juquita 🎮</h4>
<p class="text-muted">Responde rapidinho e libera seu ecocopo ou aluguel de frota.</p>

<form method="post" action="/hub-juquita">
    <div class="mb-3">
        <label class="form-label">Seu código</label>
        <input type="text" class="form-control text-uppercase" name="id_public" required autofocus>
    </div>

    <div class="mb-3">
        <label class="form-label">Quem é a sua comitiva exagerada hoje?</label>
        <select class="form-select" name="composicao" required>
            <option value="" disabled selected>Escolhe uma opção</option>
            <option value="lobo_solitario">Lobo Solitário — vim focado pra garimpar</option>
            <option value="em_casal">Em Casal</option>
            <option value="bando_galera">Bando / Galera</option>
            <option value="familia_pet">Modo Família ON / Pet Lover</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">O que você tá de olho hoje?</label>
        <select class="form-select" name="intencao_compra" required>
            <option value="" disabled selected>Escolhe uma opção</option>
            <option value="moda">Moda</option>
            <option value="pet">Pet</option>
            <option value="casa">Casa</option>
            <option value="eletro">Eletrodomésticos</option>
            <option value="beleza">Beleza</option>
            <option value="outros">Outros</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary w-100">Confirmar</button>
</form>
<p class="text-center text-muted small mt-3">
    Ainda não tem código? <a href="/form/entrada">Cadastre-se aqui</a>
</p>
{% endblock %}
